name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (for the language-models workspace)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: courses/language-models/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            courses/astrophysics/package-lock.json
            courses/cic/package-lock.json
            courses/proofs-are-programs/package-lock.json
            courses/compiler-backends/package-lock.json
            courses/incompleteness/package-lock.json
            courses/elements/package-lock.json
            courses/proofs/package-lock.json
            courses/digital-circuits/package-lock.json
            courses/particle-physics/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix courses/astrophysics
          npm ci --prefix courses/cic
          npm ci --prefix courses/proofs-are-programs
          npm ci --prefix courses/compiler-backends
          npm ci --prefix courses/incompleteness
          npm ci --prefix courses/elements
          npm ci --prefix courses/proofs
          npm ci --prefix courses/digital-circuits
          npm ci --prefix courses/particle-physics
          pnpm --dir courses/language-models install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
