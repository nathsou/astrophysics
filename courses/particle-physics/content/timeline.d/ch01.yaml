- year: 1899
  title: Natural units
  people: Max Planck
  chapter: scales-and-units
  text: Planck combines c, G and his new constant h into units of length, mass and time that depend on no human artefact.
- year: 1911
  title: The nucleus
  people: Ernest Rutherford, Hans Geiger, Ernest Marsden
  chapter: scales-and-units
  text: Alpha particles scattered backwards from gold foil show that an atom's charge and mass sit in a nucleus thousands of times smaller than the atom.
