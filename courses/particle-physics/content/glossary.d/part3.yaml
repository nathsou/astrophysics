antiparticle:
  term: antiparticle
  definition: The partner of a particle with the same mass, spin and lifetime and the opposite value of every additive quantum number (electric charge, baryon number, lepton number, strangeness and the others). A few particles, such as the photon and the π⁰, are their own antiparticles.
  chapter: antimatter
positron:
  term: positron
  definition: The antiparticle of the electron, with the electron's mass and a positive charge. Predicted by Dirac's equation and photographed by Anderson in 1932.
  chapter: antimatter
pair-production:
  term: pair production
  definition: The conversion of a photon into a particle and its antiparticle, such as e⁺e⁻, in the field of a nucleus that takes up the recoil. The photon needs at least twice the particle's rest energy.
  chapter: antimatter
annihilation:
  term: annihilation
  definition: The disappearance of a particle and its antiparticle into other particles, usually photons. An electron and positron at rest give two photons of 511 keV flying in opposite directions.
  chapter: antimatter
spinor:
  term: spinor
  definition: The multi-component wave function of a particle with spin. Dirac's equation for the electron uses four components, which describe two spin states of the particle and two of the antiparticle.
  chapter: antimatter
threshold-energy:
  term: threshold energy
  definition: The smallest beam energy at which a reaction can occur, when the centre-of-mass energy √s equals the sum of the masses of the final state. On a stationary target it grows much faster than the final mass.
  chapter: antimatter
pet:
  term: PET (positron emission tomography)
  definition: A medical imaging method. A tracer that emits positrons is injected; each positron annihilates into two back-to-back 511 keV photons, and a ring of detectors locates the source along the line between the two crystals that fire together.
  chapter: antimatter
cosmic-rays:
  term: cosmic rays
  definition: High-energy particles from space, mostly protons and atomic nuclei, that strike the atmosphere. Their energies run from below a GeV to more than 10²⁰ eV. Discovered by Hess in 1912.
  chapter: cosmic-rays-pions-muons
air-shower:
  term: air shower
  definition: The cascade of particles made when a cosmic ray hits the atmosphere, with a hadronic core, an electromagnetic part from neutral pions, and muons from the decays of charged pions.
  chapter: cosmic-rays-pions-muons
muon:
  term: muon
  definition: A particle like the electron but 207 times heavier, with a mean lifetime of 2.197 µs at rest. It feels no strong force and penetrates matter. Cosmic-ray muons reach the ground because time dilation stretches their lifetime.
  chapter: cosmic-rays-pions-muons
pion:
  term: pion
  definition: The lightest meson, in three charge states (π⁺, π⁰, π⁻) of about 135–140 MeV. Yukawa predicted it as the carrier of the nuclear force; it was found in photographic emulsions in 1947.
  chapter: cosmic-rays-pions-muons
meson:
  term: meson
  definition: A strongly interacting particle with integer spin, made in the quark model of a quark and an antiquark. The name means "middle" and referred to masses between the electron's and the proton's.
  chapter: cosmic-rays-pions-muons
time-dilation:
  term: time dilation
  definition: A moving clock runs slow by the factor γ. An unstable particle of proper lifetime τ travels on average βγcτ in the lab frame. It is why cosmic-ray muons reach the ground.
  chapter: cosmic-rays-pions-muons
nuclear-emulsion:
  term: nuclear emulsion
  definition: A photographic plate with a thick layer of silver bromide grains. A charged particle leaves a line of developed grains along its track, to be measured under a microscope. The pion was found in emulsions exposed on mountains.
  chapter: cosmic-rays-pions-muons
conservation-law:
  term: conservation law
  definition: A statement that the total of some quantity is the same before and after every reaction. Energy, momentum and electric charge are exact; strangeness is conserved by the strong and electromagnetic forces but not by the weak force.
  chapter: conservation-laws
baryon-number:
  term: baryon number
  definition: A quantum number that is +1 for baryons, −1 for antibaryons and 0 for everything else (⅓ for a quark). Its conservation keeps the proton stable.
  chapter: conservation-laws
lepton-number:
  term: lepton number
  definition: A quantum number carried by leptons and their neutrinos, defined separately for the electron, muon and tau families. Each is conserved in every reaction of charged leptons that has been observed; neutrino oscillations change the flavour of neutrinos.
  chapter: conservation-laws
strangeness:
  term: strangeness
  definition: A quantum number, S = −1 for each strange quark, +1 for each strange antiquark. The strong and electromagnetic forces conserve it; the weak force changes it by one unit at a time, which is why strange particles live long.
  chapter: conservation-laws
associated-production:
  term: associated production
  definition: The production of strange particles in pairs with opposite total strangeness, as in π⁻p → K⁰Λ, a consequence of the conservation of strangeness in strong interactions.
  chapter: conservation-laws
v-particle:
  term: V particle
  definition: An early name for the neutral strange particles (kaons and hyperons) that decay in flight into two charged particles, leaving a V-shaped pair of tracks. First photographed by Rochester and Butler in 1947.
  chapter: conservation-laws
isospin:
  term: isospin
  definition: A quantum number with the algebra of spin, under which the proton and neutron are two states of one particle. The strong force conserves it approximately; the electromagnetic force breaks it.
  chapter: the-eightfold-way
hypercharge:
  term: hypercharge
  definition: Y = B + S for the light hadrons, the same for every member of an isospin multiplet. The charge is Q = I₃ + Y/2.
  chapter: the-eightfold-way
su3-flavour:
  term: SU(3) flavour symmetry
  definition: The approximate symmetry of the strong force among u, d and s quarks, under which hadrons form multiplets such as the octet and decuplet. It is broken by the larger mass of the strange quark.
  chapter: the-eightfold-way
octet:
  term: octet
  definition: The eight-member representation of SU(3) that holds the spin-½ baryons (p, n, Λ, Σ, Ξ) and the lightest spin-0 mesons (π, K, η).
  chapter: the-eightfold-way
decuplet:
  term: decuplet
  definition: The ten-member representation of SU(3), a triangle that holds the spin-3/2 baryons Δ, Σ*, Ξ* and Ω⁻. Its missing tenth member led to the prediction of the Ω⁻.
  chapter: the-eightfold-way
weight-diagram:
  term: weight diagram
  definition: A plot of the states of a representation of SU(3) by their I₃ and hypercharge Y. The octet is a hexagon with a double state at the centre and the decuplet a triangle.
  chapter: the-eightfold-way
omega-minus:
  term: Ω⁻
  definition: The baryon with three strange quarks (S = −3, charge −1, spin 3/2), predicted by Gell-Mann in 1962 to complete the decuplet and found at Brookhaven in 1964 with a mass of 1672 MeV.
  chapter: the-eightfold-way
quark:
  term: quark
  definition: A spin-½ particle with a fractional charge (+⅔ or −⅓) and a colour, from which hadrons are made. There are six flavours; hadrons are baryons (three quarks) or mesons (a quark and an antiquark). No free quark has been observed.
  chapter: quarks
constituent-mass:
  term: constituent mass
  definition: The effective mass of a quark inside a hadron, about 340 MeV for u and d and 510 MeV for s. It is far larger than the quark's own mass in the equations (a few MeV for u and d), the rest being the energy of the strong force.
  chapter: quarks
vector-meson:
  term: vector meson
  definition: A meson with spin 1 made of a quark and an antiquark with parallel spins, such as the ρ, ω and φ. It has the quantum numbers of a photon, so it can decay to a lepton pair through a virtual photon.
  chapter: quarks
deep-inelastic-scattering:
  term: deep inelastic scattering
  definition: The scattering of a lepton from a nucleon at large momentum transfer in which the nucleon breaks up. SLAC–MIT experiments in 1967–69 found scattering from point-like constituents inside the proton.
  chapter: quarks
bjorken-x:
  term: Bjorken x
  definition: x = Q²/(2Mν). In deep inelastic scattering it is the fraction of the proton's momentum carried by the struck parton.
  chapter: quarks
bjorken-scaling:
  term: Bjorken scaling
  definition: The approximate independence of the structure functions of Q² at fixed x, found at SLAC, which shows that the proton contains point-like constituents. QCD predicts small violations.
  chapter: quarks
parton:
  term: parton
  definition: Feynman's name for a point-like constituent of a fast proton. The charged partons are quarks and antiquarks; the neutral ones are gluons.
  chapter: quarks
parton-distribution-function:
  term: parton distribution function (PDF)
  definition: The density f(x, Q²) of partons of one kind with momentum fraction x in the proton, at resolution Q. They are fitted to data and used by every proton-collider generator.
  chapter: quarks
