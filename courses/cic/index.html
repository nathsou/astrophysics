<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>try { if (localStorage.getItem('cic:sidebar') === 'collapsed') document.documentElement.dataset.sidebar = 'collapsed'; } catch {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem('theme') ?? localStorage.getItem('cic-theme');
        const preference = saved === 'auto' ? 'system' : saved;
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
      // CIC-only palette (lilac | paper), separate from the shared theme key
      try {
        document.documentElement.dataset.palette = localStorage.getItem('cic-palette') === 'paper' ? 'paper' : 'lilac';
      } catch {}
    </script>
    <meta name="description" content="An interactive course on the Calculus of Inductive Constructions — from the untyped λ-calculus to the type theory of Lean 4, with a real kernel running in the browser." />
    <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15131d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%236a4cc4'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='white'%3E%CE%BB%3C/text%3E%3C/svg%3E" />
    <title>The Calculus of Inductive Constructions — an interactive course</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This course is interactive and needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
