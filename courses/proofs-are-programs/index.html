<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>try { if (localStorage.getItem('proofs-are-programs:sidebar') === 'collapsed') document.documentElement.dataset.sidebar = 'collapsed'; } catch {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem('theme');
        const preference = saved === 'auto' ? 'system' : saved;
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
    </script>
    <meta name="description" content="Proofs Are Programs — an interactive course on the Curry–Howard correspondence for programmers: write proofs as programs, prove programs correct, and build your own type checker, in a Lean-inspired language running in the browser." />
    <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23237a45'/%3E%3Cstop offset='1' stop-color='%231a64b8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='white'%3E%E2%8A%A2%3C/text%3E%3C/svg%3E" />
    <title>Proofs Are Programs — an interactive course</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This course is interactive and needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
