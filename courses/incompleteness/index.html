<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // The theme preference is shared by every course in the collection.
      try {
        const saved = localStorage.getItem('theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
    </script>
    <meta name="description" content="An executable adaptation of Richard Zach's Incompleteness and Computability (Open Logic Project, CC BY 4.0): Gödel numbering, representability and the fixed-point lemma, with objects you can build, inspect and follow through the proofs." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23233a6b'/%3E%3Ctext x='16' y='22.5' font-family='Georgia' font-size='17' text-anchor='middle' fill='white'%3E%E2%8C%9C%E2%8C%9D%3C/text%3E%3C/svg%3E" />
    <title>Incompleteness and Computability — an executable edition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
