# id: { term, definition (Markdown), chapter (slug that introduces it) }
add-k:
  term: Add-k smoothing
  definition: Adding a pseudo-count $k$ to every n-gram count before normalising, so no continuation has probability zero. $k = 1$ is Laplace smoothing.
  chapter: n-gram-models
arithmetic-coding:
  term: Arithmetic coding
  definition: A compression method that encodes a whole message as one number, spending about $-\log_2 q(x_t \mid x_{<t})$ bits per symbol. It turns any predictive model into a compressor.
  chapter: information-theory
backoff:
  term: Backoff
  definition: Using a shorter context’s estimate when the longer context was not seen often enough (Katz, 1987).
  chapter: n-gram-models
bpe:
  term: Byte-pair encoding (BPE)
  definition: A tokenisation method that starts from bytes and repeatedly merges the most frequent adjacent pair into a new token.
  chapter: tokenisation
chain-rule:
  term: Chain rule of probability
  definition: $P(x_1, \ldots, x_T) = \prod_t P(x_t \mid x_{<t})$ — the factorisation that turns sequence modelling into next-token prediction.
  chapter: text-as-data
code-point:
  term: Code point
  definition: The integer Unicode assigns to a character, written U+XXXX, from U+0000 to U+10FFFF.
  chapter: text-as-data
conditional-entropy:
  term: Conditional entropy
  definition: $H(Y \mid X)$, the uncertainty left in $Y$ once $X$ is known, averaged over $X$.
  chapter: information-theory
continuation-count:
  term: Continuation count
  definition: In Kneser–Ney smoothing, the number of distinct contexts a token has been seen to follow, $N_{1+}(\bullet\, w)$.
  chapter: n-gram-models
corpus:
  term: Corpus
  definition: A body of text used to train or evaluate a model (plural *corpora*).
  chapter: text-as-data
cross-entropy:
  term: Cross-entropy
  definition: The average surprisal $-\log q(x_t \mid x_{<t})$ of the actual data under a model $q$. The training loss of every language model in the course.
  chapter: n-gram-models
entropy:
  term: Entropy
  definition: The expected surprisal of a distribution, $H(p) = -\sum_x p(x) \log p(x)$ — its irreducible uncertainty.
  chapter: text-as-data
glitch-token:
  term: Glitch (under-trained) token
  definition: A token that exists in the vocabulary but was rare in the model’s training data, so its embedding is barely trained — e.g. GPT-2’s ` SolidGoldMagikarp`.
  chapter: tokenisation
grapheme:
  term: Grapheme cluster
  definition: What a reader perceives as one character, which may consist of several code points (e.g. `e` + combining accent, or an emoji family).
  chapter: text-as-data
hapax:
  term: Hapax legomenon
  definition: A word type that occurs exactly once in a corpus. Typically about half of all word types.
  chapter: text-as-data
heaps-law:
  term: Heaps’ law
  definition: Vocabulary size grows as a sublinear power of text length, $V(n) = K n^\beta$ with $0 < \beta < 1$.
  chapter: text-as-data
interpolation:
  term: Interpolation (smoothing)
  definition: Mixing the estimates of several n-gram orders, e.g. $\lambda \hat P(w \mid h) + (1-\lambda) P(w \mid h')$.
  chapter: n-gram-models
kl-divergence:
  term: KL divergence
  definition: $D_{\mathrm{KL}}(p \,\|\, q) = \sum_x p(x) \log \frac{p(x)}{q(x)}$ — the extra cost of using $q$ when the data follow $p$. Non-negative and asymmetric.
  chapter: information-theory
kneser-ney:
  term: Kneser–Ney smoothing
  definition: Smoothing that subtracts a fixed discount from every seen count and backs off to a lower-order distribution built from continuation counts.
  chapter: n-gram-models
language-model:
  term: Language model
  definition: A probability distribution over sequences of tokens, usually factorised into next-token predictions $P(x_t \mid x_{<t})$.
  chapter: text-as-data
markov-assumption:
  term: Markov assumption
  definition: The approximation that the next symbol depends only on the previous $n - 1$ symbols.
  chapter: n-gram-models
mle:
  term: Maximum-likelihood estimation (MLE)
  definition: Choosing parameters that make the observed data most probable. For categorical distributions the MLE is the relative frequency.
  chapter: n-gram-models
mutual-information:
  term: Mutual information
  definition: $I(X; Y) = H(X) - H(X \mid Y)$ — how much knowing one variable tells you about the other.
  chapter: information-theory
n-gram:
  term: N-gram
  definition: A sequence of $n$ consecutive tokens. An n-gram model predicts each token from the previous $n - 1$.
  chapter: n-gram-models
normalisation:
  term: Unicode normalisation
  definition: Rewriting text into a canonical form (NFC, NFD, NFKC or NFKD) so that equivalent strings have identical code points.
  chapter: text-as-data
overfitting:
  term: Overfitting
  definition: Fitting accidents of the training data so closely that performance on new data gets worse — training loss falls while validation loss rises.
  chapter: n-gram-models
perplexity:
  term: Perplexity
  definition: $2^{H}$ for a cross-entropy $H$ in bits — the effective number of equally likely choices a model is weighing per token.
  chapter: n-gram-models
pre-tokenisation:
  term: Pre-tokenisation
  definition: Splitting text into chunks (words with their leading space, numbers, punctuation) with a regular expression before learning or applying merges.
  chapter: tokenisation
smoothing:
  term: Smoothing
  definition: Any method that moves probability mass from seen to unseen events so a model never assigns probability zero.
  chapter: n-gram-models
sparsity:
  term: Data sparsity
  definition: The fact that most possible n-grams never occur in any finite corpus, so their probabilities cannot be estimated by counting.
  chapter: n-gram-models
special-token:
  term: Special token
  definition: A reserved token such as `<|endoftext|>` that marks structure (document boundaries, chat turns) and cannot be produced by ordinary text.
  chapter: tokenisation
surprisal:
  term: Surprisal
  definition: The information in an outcome, $-\log p(x)$. Rare outcomes are more surprising.
  chapter: text-as-data
token:
  term: Token
  definition: One unit of text as the model sees it — a character, byte, word or subword. Also, one occurrence of a unit in running text (as opposed to a *type*).
  chapter: tokenisation
type:
  term: Type
  definition: A distinct unit in a vocabulary. “To be or not to be” has six word tokens but four word types.
  chapter: text-as-data
utf-8:
  term: UTF-8
  definition: The variable-length encoding of Unicode code points as 1–4 bytes; ASCII-compatible and self-synchronising.
  chapter: text-as-data
validation-set:
  term: Validation set
  definition: Held-out data used to measure generalisation and tune hyperparameters. A separate test set is kept for final results.
  chapter: n-gram-models
vocabulary:
  term: Vocabulary
  definition: The fixed set of tokens a model can read and write; its size $V$ sets the size of the input and output layers.
  chapter: tokenisation
zipf-law:
  term: Zipf’s law
  definition: The frequency of the $r$-th most common word is roughly proportional to $1/r^s$ with $s \approx 1$.
  chapter: text-as-data
kernel:
  term: Kernel (GPU)
  definition: A function that runs on the GPU once per thread of a dispatch, each thread using its built-in ids to choose which data to work on.
  chapter: gpu-compute
workgroup:
  term: Workgroup
  definition: A group of GPU threads (CUDA calls it a *block*) that run on one compute unit and can share fast workgroup memory and synchronise with barriers.
  chapter: gpu-compute
workgroup-memory:
  term: Workgroup memory
  definition: Small, fast on-chip memory shared by the threads of one workgroup (CUDA *shared memory*); used to stage data that many threads reuse.
  chapter: gpu-compute
barrier:
  term: Barrier
  definition: A synchronisation point (`workgroupBarrier()` in WGSL) that no thread of a workgroup passes until all have reached it, so writes to workgroup memory are visible to all.
  chapter: gpu-compute
arithmetic-intensity:
  term: Arithmetic intensity
  definition: Floating-point operations performed per byte moved to or from memory. Low intensity makes a kernel memory-bound; high intensity lets it be compute-bound.
  chapter: gpu-compute
roofline:
  term: Roofline model
  definition: "Attainable performance = min(peak FLOP/s, arithmetic intensity × memory bandwidth) — a plot that shows whether a kernel is limited by memory or by arithmetic."
  chapter: gpu-compute
memory-bound:
  term: Memory-bound
  definition: Limited by how fast data can be moved rather than by arithmetic. Element-wise operations, normalisation and softmax are memory-bound on every modern GPU.
  chapter: gpu-compute
tiling:
  term: Tiling
  definition: Splitting a computation into blocks that fit in fast memory, so each value loaded from slow memory is reused many times. The key to fast matrix multiplication.
  chapter: gpu-compute
kernel-fusion:
  term: Kernel fusion
  definition: Combining several operations into one kernel so intermediate results stay on-chip instead of being written to and re-read from memory.
  chapter: gpu-compute
recurrent-network:
  term: Recurrent neural network (RNN)
  definition: A network that reads a sequence one element at a time, updating a fixed-size hidden state with the same weights at every step.
  chapter: recurrent-networks
bptt:
  term: Backpropagation through time (BPTT)
  definition: Backpropagation applied to a recurrent network unrolled over the steps of a sequence. *Truncated* BPTT backpropagates only within chunks, carrying the state forward but not the gradient.
  chapter: recurrent-networks
vanishing-gradient:
  term: Vanishing and exploding gradients
  definition: Gradients that shrink or grow exponentially as they pass back through many layers or time steps, because they are products of many Jacobians.
  chapter: recurrent-networks
lstm:
  term: LSTM (long short-term memory)
  definition: A gated recurrent cell with an additively updated cell state, whose forget, input and output gates let information and gradients persist over many steps.
  chapter: recurrent-networks
gradient-clipping:
  term: Gradient clipping
  definition: Rescaling the gradient when its norm exceeds a threshold, keeping its direction; prevents exploding gradients from derailing training.
  chapter: recurrent-networks
attention:
  term: Attention
  definition: A weighted average of value vectors, with weights from a softmax over query–key dot products. Lets each position read directly from any other.
  chapter: attention
self-attention:
  term: Self-attention
  definition: Attention in which queries, keys and values are all projections of the same sequence.
  chapter: attention
causal-mask:
  term: Causal mask
  definition: The mask that stops each position attending to later positions (adds −∞ above the diagonal), so a language model cannot see the token it must predict.
  chapter: attention
multi-head-attention:
  term: Multi-head attention
  definition: Several attention operations (heads) run in parallel on lower-dimensional projections, their outputs concatenated and mixed by a final projection.
  chapter: attention
induction-head:
  term: Induction head
  definition: A two-step attention circuit that finds an earlier occurrence of the current token and copies the token that followed it — a basis of in-context learning.
  chapter: attention
residual-connection:
  term: Residual connection
  definition: Adding a layer’s output to its input (x ← x + f(x)), so each layer refines a running representation instead of replacing it.
  chapter: attention
transformer:
  term: Transformer
  definition: A network of stacked blocks, each an attention layer and a per-position MLP wrapped in residual connections and normalisation (Vaswani et al., 2017). GPT is a decoder-only Transformer.
  chapter: transformer
residual-stream:
  term: Residual stream
  definition: The vector at each position that flows through a Transformer; every block reads it (through LayerNorm) and adds its output to it.
  chapter: transformer
pre-norm:
  term: Pre-norm
  definition: Normalising each block's input rather than its output (x ← x + f(LN(x))), which keeps a clean residual path and makes deep Transformers easy to train.
  chapter: transformer
weight-tying:
  term: Weight tying
  definition: Using the token embedding matrix as the output layer too, so each token has one vector for reading and predicting it.
  chapter: transformer
positional-encoding:
  term: Positional encoding
  definition: Information about each token's position added to its vector (learned, sinusoidal or rotary), since attention itself ignores order.
  chapter: transformer
epoch:
  term: Epoch
  definition: One complete pass over the training data. Large language models are often trained for about one epoch; small datasets are repeated many times.
  chapter: training-loop
gradient-accumulation:
  term: Gradient accumulation
  definition: Summing the gradients of several micro-batches (each loss divided by their number) before one optimiser step, to reach a batch too large for memory.
  chapter: training-loop
warmup:
  term: Learning-rate warm-up
  definition: Increasing the learning rate from near zero to its peak over the first steps of training, to avoid destabilising the untrained model.
  chapter: training-loop
cosine-schedule:
  term: Cosine schedule
  definition: Decaying the learning rate along half a cosine from its peak to a small fraction of it over the run.
  chapter: training-loop
mfu:
  term: Model FLOPs utilisation (MFU)
  definition: The fraction of the hardware's peak arithmetic rate that a training run actually uses for the model's required computation.
  chapter: training-loop
checkpoint:
  term: Checkpoint
  definition: A saved snapshot of a training run — weights, optimiser state, step, random state and configuration — from which it can resume.
  chapter: training-loop
safetensors:
  term: Safetensors
  definition: A simple, safe file format for tensors (a JSON header plus raw bytes), used to share model weights without the code-execution risk of pickle.
  chapter: training-loop
momentum:
  term: Momentum
  definition: An optimiser that steps along a decaying sum of past gradients, accelerating along consistent directions and damping oscillations.
  chapter: optimisers
adam:
  term: Adam
  definition: An optimiser that divides a momentum-averaged gradient by the root-mean-square of recent gradients, per parameter, with bias correction.
  chapter: optimisers
adamw:
  term: AdamW
  definition: Adam with decoupled weight decay — weights are shrunk directly rather than through the gradient — the standard optimiser for language models.
  chapter: optimisers
weight-decay:
  term: Weight decay
  definition: Shrinking every weight by a small fraction at each step, a regulariser equivalent to a Gaussian prior on the weights.
  chapter: optimisers
condition-number:
  term: Condition number
  definition: The ratio of the largest to the smallest curvature of a loss surface; large values make plain gradient descent slow.
  chapter: optimisers
muon:
  term: Muon
  definition: An optimiser for weight matrices that orthogonalises the momentum update (every singular value set to about 1) with a Newton–Schulz iteration.
  chapter: optimisers
parity-test:
  term: Parity test
  definition: A test that two implementations of the same computation — for example PyTorch and our WebGPU engine — give the same outputs from the same inputs, within a tolerance set by their floating-point precision.
  chapter: scaling-up
mixed-precision:
  term: Mixed precision
  definition: Training with matrix multiplications in a 16-bit format (bfloat16 or float16) while keeping the weights, optimiser state and sensitive operations in float32.
  chapter: scaling-up
bfloat16:
  term: bfloat16
  definition: A 16-bit floating-point format with float32’s 8 exponent bits and 7 mantissa bits — float32’s range at low precision — the standard format for training on modern accelerators.
  chapter: scaling-up
loss-scaling:
  term: Loss scaling
  definition: Multiplying the loss by a large factor before the backward pass so that small gradients do not underflow in float16, then dividing the gradients by it before the update.
  chapter: scaling-up
flashattention:
  term: FlashAttention
  definition: An exact attention algorithm that processes keys and values in blocks with a running softmax, so the T × T score matrix is never written to GPU memory.
  chapter: scaling-up
activation-checkpointing:
  term: Activation checkpointing
  definition: Storing only some activations during the forward pass and recomputing the rest during the backward pass, trading compute for memory.
  chapter: scaling-up
decoding:
  term: Decoding
  definition: The procedure that turns a language model’s next-token distributions into text — greedy choice, sampling with temperature and truncation, or a search such as beam search.
  chapter: sampling
temperature:
  term: Temperature
  definition: A divisor applied to the logits before the softmax. T < 1 sharpens the distribution towards the most probable tokens, T > 1 flattens it, and T → 0 is greedy decoding.
  chapter: sampling
top-p:
  term: Top-p (nucleus) sampling
  definition: Sampling only from the smallest set of most probable tokens whose total probability reaches p, renormalised.
  chapter: sampling
min-p:
  term: Min-p sampling
  definition: Sampling only from tokens whose probability is at least a fixed fraction of the most probable token’s.
  chapter: sampling
beam-search:
  term: Beam search
  definition: A search that keeps the k most probable partial sequences at every step, extending each and pruning back to k, to approximate the most probable complete sequence.
  chapter: sampling
kv-cache:
  term: KV cache
  definition: The keys and values of every layer for all positions generated so far, kept in memory so each new token needs only its own position's computation.
  chapter: inference
prefill:
  term: Prefill and decode
  definition: The two phases of generation. Prefill processes the whole prompt in parallel (compute-bound); decode produces one token per step (memory-bound).
  chapter: inference
quantisation:
  term: Quantisation
  definition: Storing weights (or activations) with fewer bits — int8, int4 — using per-group scales, to cut memory and the bytes read per token.
  chapter: inference
speculative-decoding:
  term: Speculative decoding
  definition: Generating several tokens per step of a large model by letting a cheap drafter propose them and the large model verify them all at once, with an acceptance rule that preserves its distribution exactly.
  chapter: inference
scaling-law:
  term: Scaling law
  definition: An empirical power law relating a model’s loss to its size, its training data or its training compute, such as L(N, D) = E + A/N^α + B/D^β.
  chapter: scaling-laws
compute-optimal:
  term: Compute-optimal
  definition: The split of a fixed training budget C ≈ 6ND between model size N and training tokens D that minimises the loss; for Chinchilla, about 20 tokens per parameter.
  chapter: scaling-laws
isoflop:
  term: IsoFLOP curve
  definition: Final loss against model size for runs that all use the same training compute; its minimum gives the compute-optimal size.
  chapter: scaling-laws
rmsnorm:
  term: RMSNorm
  definition: Normalisation that divides a vector by its root mean square and scales it by a learned gain — LayerNorm without the mean subtraction and the bias.
  chapter: modern-architecture
swiglu:
  term: SwiGLU
  definition: A gated MLP, W₂(SiLU(W_g x) ⊙ W₁ x), in which one projection decides, element by element, how much of another passes through.
  chapter: modern-architecture
rope:
  term: Rotary position embedding (RoPE)
  definition: Encoding positions by rotating pairs of query and key coordinates by angles proportional to the position, so that attention scores depend only on relative offsets.
  chapter: modern-architecture
gqa:
  term: Grouped-query attention (GQA)
  definition: Attention in which groups of query heads share one key and value head, shrinking the KV cache; multi-query attention is the extreme of one shared head.
  chapter: modern-architecture
mixture-of-experts:
  term: Mixture of experts (MoE)
  definition: A layer made of many expert networks, of which a learned router activates only a few for each token, so the parameter count grows without the compute per token growing with it.
  chapter: mixture-of-experts
router:
  term: Router
  definition: The small learned layer in a mixture of experts that scores the experts for each token and selects the top k.
  chapter: mixture-of-experts
load-balancing:
  term: Load-balancing loss
  definition: An auxiliary loss that penalises routers for sending most tokens to a few experts, keeping every expert trained and the work spread across devices.
  chapter: mixture-of-experts
fine-tuning:
  term: Fine-tuning
  definition: Continuing the training of a pre-trained model on a smaller, task-specific dataset, starting from its weights.
  chapter: fine-tuning
sft:
  term: Supervised fine-tuning (SFT)
  definition: Fine-tuning on examples of the desired behaviour — for example instructions and good responses — with the loss computed only on the responses.
  chapter: fine-tuning
lora:
  term: LoRA
  definition: Low-rank adaptation — freezing a weight matrix W and training only a low-rank update A·B added to it, with a tiny fraction of W's parameters.
  chapter: fine-tuning
catastrophic-forgetting:
  term: Catastrophic forgetting
  definition: The loss of previously learned abilities when a network is trained further on a new task.
  chapter: fine-tuning
reward-model:
  term: Reward model
  definition: A model trained on human (or AI) preference comparisons to score responses, used to train or select a language model's outputs.
  chapter: preference-learning
rlhf:
  term: RLHF
  definition: Reinforcement learning from human feedback — training a language model to maximise a learned reward model's score, with a penalty for drifting from the original model.
  chapter: preference-learning
dpo:
  term: DPO
  definition: Direct Preference Optimization — training a language model directly on preference pairs with a classification-style loss, without a separate reward model or reinforcement learning.
  chapter: preference-learning
chain-of-thought:
  term: Chain of thought
  definition: Intermediate reasoning written out as text before a final answer, which gives the model more computation per answer and a form it can learn to check.
  chapter: reasoning
grpo:
  term: GRPO
  definition: Group Relative Policy Optimisation — policy-gradient training in which each prompt's sampled answers are scored and compared with the group's mean reward, without a learned value function.
  chapter: reasoning
test-time-compute:
  term: Test-time compute
  definition: Spending more computation when answering — longer reasoning, many samples with voting or verification — to get better answers from the same model.
  chapter: reasoning
tool-use:
  term: Tool use
  definition: A model writing requests in a format a program can execute — a calculation, a search, a function call — with the program's result written back into the model's context.
  chapter: tool-use
function-calling:
  term: Function calling
  definition: Tool use through a fixed, structured format — typically JSON naming a function and its arguments, validated against a schema the prompt supplies.
  chapter: tool-use
rag:
  term: Retrieval-augmented generation
  definition: Retrieving the passages most relevant to a question from a document collection and adding them to the prompt, so the model answers from them rather than from its weights alone.
  chapter: tool-use
tf-idf:
  term: TF-IDF
  definition: A word's weight in a document — its frequency there, times the logarithm of how rare it is across documents — used to represent documents for search.
  chapter: tool-use
agent:
  term: Agent
  definition: A model that uses tools in a loop, choosing each action from the results of the previous ones, until a task is done.
  chapter: tool-use
prompt-injection:
  term: Prompt injection
  definition: Instructions hidden in content a model reads — a web page, an email, a tool result — that hijack it into doing what their author, not its user, wants.
  chapter: tool-use
vision-transformer:
  term: Vision transformer (ViT)
  definition: A Transformer that reads an image as a sequence of patches, each flattened and linearly projected to a token embedding.
  chapter: multimodality
contrastive-learning:
  term: Contrastive learning
  definition: Training embeddings so that matching pairs (an image and its caption) are closer than mismatched ones, with each pair's partners in the batch as the negatives.
  chapter: multimodality
zero-shot:
  term: Zero-shot
  definition: Performing a task with no examples of it in training or in the prompt — for CLIP, classifying images into categories named only by text.
  chapter: multimodality
diffusion:
  term: Diffusion model
  definition: A generative model trained to remove noise; it generates by starting from pure noise and denoising step by step.
  chapter: multimodality
benchmark:
  term: Benchmark
  definition: A fixed set of test items with a scoring rule, used to compare models. Its score is an estimate, with sampling error that shrinks as the square root of the number of items.
  chapter: evaluation
contamination:
  term: Contamination
  definition: Test items (or close copies) appearing in a model's training data, which inflates its score without improving its ability.
  chapter: evaluation
calibration:
  term: Calibration
  definition: Agreement between a model's confidence and its accuracy — a calibrated model is right 70% of the time when it says 70%.
  chapter: evaluation
llm-judge:
  term: LLM judge
  definition: A language model asked to grade or compare other models' answers, used where no exact answer exists; cheap, but biased towards length, position and its own style.
  chapter: evaluation
logit-lens:
  term: Logit lens
  definition: Reading an intermediate layer's residual stream through the model's final normalisation and output layer, to see what it would predict if the network stopped there.
  chapter: interpretability
probe:
  term: Probe
  definition: A small classifier, usually linear, trained on a model's internal activations to test whether some property can be read from them.
  chapter: interpretability
superposition:
  term: Superposition
  definition: A network representing more features than it has dimensions, as nearly orthogonal directions, relying on the features rarely being active together.
  chapter: interpretability
sparse-autoencoder:
  term: Sparse autoencoder (SAE)
  definition: An autoencoder trained to reconstruct a model's activations from a much larger set of features of which only a few are active at a time, to find interpretable directions.
  chapter: interpretability
data-parallelism:
  term: Data parallelism
  definition: Every GPU holds a copy of the model and processes a different part of the batch; gradients are averaged across GPUs after each step.
  chapter: efficiency
tensor-parallelism:
  term: Tensor parallelism
  definition: Splitting each weight matrix across GPUs so that every layer's matrix multiplications are computed jointly, with communication inside every layer.
  chapter: efficiency
pipeline-parallelism:
  term: Pipeline parallelism
  definition: Placing consecutive groups of layers on different GPUs and streaming micro-batches through them, at the cost of idle time while the pipeline fills and drains.
  chapter: efficiency
zero:
  term: ZeRO / FSDP
  definition: Data parallelism in which the optimiser state, gradients and even the weights are sharded across GPUs rather than replicated, and gathered when needed.
  chapter: efficiency
paged-attention:
  term: Paged attention
  definition: Storing each sequence's KV cache in fixed-size blocks allocated on demand, like virtual-memory pages, so that memory is not reserved for tokens that never come.
  chapter: efficiency
continuous-batching:
  term: Continuous batching
  definition: Serving requests by adding and removing sequences from the running batch at every decoding step, rather than waiting for a whole batch to finish.
  chapter: efficiency
jailbreak:
  term: Jailbreak
  definition: An input that gets a model to do what its safety training was meant to prevent, such as a role-play framing or an optimised adversarial suffix.
  chapter: safety
backdoor:
  term: Backdoor
  definition: Hidden behaviour planted in a model — typically through poisoned training data — that appears only when a specific trigger is present.
  chapter: safety
reward-hacking:
  term: Reward hacking
  definition: A trained system scoring highly on its reward by exploiting flaws in how the reward is measured, rather than by doing what the reward was meant to encourage.
  chapter: safety
red-teaming:
  term: Red teaming
  definition: Deliberately searching for inputs that make a model behave badly, by people or by other models, before (and after) it is deployed.
  chapter: safety
