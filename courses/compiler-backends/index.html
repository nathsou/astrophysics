<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem('theme') ?? localStorage.getItem('cic-theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
    </script>
    <meta name="description" content="An interactive course on compiler backends: build a real backend from SSA IR to RISC-V, AArch64, x86-64 and WebAssembly machine code." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2317231b'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='%23f1f3ee' stroke-width='1.2'/%3E%3C/svg%3E" />
    <title>SSA to Silicon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
