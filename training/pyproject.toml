[project]
name = "lmcourse"
version = "0.1.0"
description = "Python companion to the course 'Language Models from Scratch'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
]

[project.optional-dependencies]
# PyTorch arrives in Chapter 14. Install with:  uv sync --extra torch
torch = [
    "torch>=2.14",
    "safetensors>=0.8",
]

[project.scripts]
lmc = "lmcourse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CUDA wheels on Linux (RTX 4060 Ti); the default PyPI wheels on macOS use Apple's MPS backend.
# cu130 needs an NVIDIA driver >= 580. With an older driver, switch both entries to cu126.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
